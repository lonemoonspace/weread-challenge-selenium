# Overlay for running a locally built or locally loaded linux/arm64 image.
#
# The base compose file pins jqknono/weread-challenge:latest with
# `pull_policy: always`, so a local arm64 image would be ignored in favour of the
# published one. This overlay points the app service at the local image and
# forbids pulling.
#
# Usage (from this directory):
#   node scripts/docker-image.js build --platform linux/arm64 --tag arm64-trial
#   docker compose -f docker-compose.yml -f docker-compose.arm64.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.arm64.yml logs -f app
#   docker compose -f docker-compose.yml -f docker-compose.arm64.yml down
#
# A prebuilt image can be loaded instead, as long as it carries the same tag:
#   docker load -i weread-challenge-0.18.0-arm64.docker.tar.gz
#
# selenium/standalone-chromium publishes linux/arm64, so the stock selenium
# service needs no change.
services:
  app:
    image: jqknono/weread-challenge:arm64-trial
    pull_policy: never
